name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        java:
          - temurin-8.0.504+1
          - temurin-11.0.32+101
    runs-on: ${{ matrix.os }}
    env:
      MISE_JAVA_VERSION: ${{ matrix.java }}
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: 驗證 mise Java
        run: mise exec -- java -version
      - name: 在 Linux 驗證與封裝
        if: runner.os != 'Windows'
        run: mise exec -- ./gradlew --no-daemon check shadowJar
      - name: 在 Windows 驗證與封裝
        if: runner.os == 'Windows'
        run: mise exec -- .\gradlew.bat --no-daemon check shadowJar
