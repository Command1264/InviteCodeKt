  player-only: "&e此指令只能由玩家執行。"
  unavailable: "&c目前無法執行此操作：{detail}"
  help-header: "&6指令說明"
  help-row: "&e{usage} &7— &f{description}"
  help-player-section: "&6玩家操作"
  help-admin-section: "&6管理操作"
  help-description:
    help: "查看指令說明"
    code: "查看或建立自己的邀請碼"
    claim: "使用別人的邀請碼"
    confirm: "同意目前的邀請確認"
    cancel: "取消輸入或確認"
    status: "查看自己的邀請狀態"
    stats: "查看自己的邀請統計"
    inspect-player: "查詢玩家紀錄"
    inspect-invitation: "查詢邀請關係"
    inspect-reward: "查詢獎勵動作"
