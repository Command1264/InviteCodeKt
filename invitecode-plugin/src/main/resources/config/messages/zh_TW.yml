    transfer: "轉移邀請關係"
    force-qualify: "強制達成邀請資格"
    reset-eligibility: "重設玩家登記資格"
    retry-reward: "重試獎勵動作"
    mark-delivered: "標記獎勵動作已交付"
    rotate-code: "輪替玩家邀請碼"
    migrate-storage: "更新儲存結構版本"
    reload: "重新載入設定與訊息"
    doctor: "檢查執行狀態與儲存健康"
  help-frame-header: "&8──── {prefix}&6{title} &8────"
  help-frame-divider: "&8────────────────────────"
